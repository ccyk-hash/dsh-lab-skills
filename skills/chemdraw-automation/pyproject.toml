[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemdraw-auto"
version = "0.1.0"
description = "Drive a local ChemDraw installation through CDXML and COM: draw, edit and export editable chemical figures."
requires-python = ">=3.10"
dependencies = [
    "pywin32>=306",
    "rdkit>=2024.3",
    "lxml>=5.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chemdraw-auto = "chemdraw_auto.cli:main"

[tool.setuptools.packages.find]
include = ["chemdraw_auto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
